name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  py:
    name: Worker (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov
      - name: Mapping eval suite (mock provider, fails below threshold)
        run: uv run python -m collectoo_worker.ai.evals mapping
      - name: Reconciliation eval (100k-credit synthetic statement; fails below 95 % or on a wrong match)
        run: uv run python -m collectoo_worker.payments.reconciliation_eval
      - name: supabase/seed.sql is up to date
        run: |
          uv run synth seed-sql > ../supabase/seed.sql
          git diff --exit-code -- ../supabase/seed.sql

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: Database (migrations, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        id: supabase_cli
        continue-on-error: true  # GitHub release downloads sometimes 504: fallback below
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install the Supabase CLI (fallback with longer retries)
        if: steps.supabase_cli.outcome == 'failure'
        run: |
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C /usr/local/bin supabase
          supabase --version
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - name: Generated DB types are up to date
        run: |
          supabase gen types typescript --local --schema public > apps/web/src/lib/database.types.ts
          git diff --exit-code -- apps/web/src/lib/database.types.ts
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Worker integration tests (queue, storage, commit, statements, matching, allocation, receipts)
        run: |
          eval "$(./scripts/local-env.sh)"
          cd worker && uv sync --frozen && uv run pytest -m integration --ignore-glob='*scale_integration.py'

  scale:
    name: Scale runs (50k boarding, statement, matching, allocation; 5k receipts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        id: supabase_cli
        continue-on-error: true  # GitHub release downloads sometimes 504: fallback below
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install the Supabase CLI (fallback with longer retries)
        if: steps.supabase_cli.outcome == 'failure'
        run: |
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C /usr/local/bin supabase
          supabase --version
      - run: supabase start
      - run: supabase db reset
      - name: Log the plan of any statement slower than 60 s (read when the job fails)
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q \
            -c "alter system set pg_stat_statements.track = 'all'" \
            -c "alter system set session_preload_libraries = 'auto_explain'" \
            -c "alter system set auto_explain.log_min_duration = '60s'" \
            -c "alter system set auto_explain.log_nested_statements = on" \
            -c "select pg_reload_conf()"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: 50k scale runs (each must stay under its own time budget)
        env:
          RECEIPT_FILES: "5000"  # rendering ~10 ms a receipt: 50k is the benchmark (docs/benchmarks/payments.md)
        run: |
          eval "$(./scripts/local-env.sh)"
          cd worker && uv sync --frozen && uv run pytest -m integration -s tests/*scale_integration.py
      - name: Slowest statements and the plans of those over 60 s
        if: failure()
        run: |
          psql "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" -P pager=off -c \
            "select round(max_exec_time) as max_ms, calls, round(total_exec_time) as total_ms,
                    left(regexp_replace(query, '\s+', ' ', 'g'), 400) as query
             from pg_stat_statements order by max_exec_time desc limit 40"
          docker logs supabase_db_collectoo 2>&1 | grep -A 120 "duration: .* plan:" | head -3000 || true

  catalogue:
    name: EU template catalogue is reproducible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: make catalogue
      - name: Generated files match the committed ones
        run: git diff --exit-code -- docs/reference supabase/migrations/20261108110100_eba_layer1.sql worker/src/collectoo_worker/eba

  e2e:
    name: E2E (Playwright against the local stack, mobile + desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        id: supabase_cli
        continue-on-error: true  # GitHub release downloads sometimes 504: fallback below
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install the Supabase CLI (fallback with longer retries)
        if: steps.supabase_cli.outcome == 'failure'
        run: |
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/supabase.tar.gz" \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C /usr/local/bin supabase
          supabase --version
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: supabase start
      - name: Export local Supabase settings
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Start the worker on the boarding and payments queues (mock LLM, mock addresses)
        run: |
          eval "$(./scripts/local-env.sh)"
          cd worker && uv sync --frozen
          LLM_PROVIDER=mock ADDRESS_NORMALISER=mock nohup uv run collectoo-worker consume boarding payments > ../worker.log 2>&1 &
      - run: npm run build
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - name: Worker log
        if: failure()
        run: tail -n 100 worker.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
