[project]
name = "collectoo-worker"
version = "0.1.0"
description = "Collectoo worker: boarding, calculation engine, ledger, flows, channels, AI gateway"
authors = [{ name = "Collectoo" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
collectoo-worker = "collectoo_worker:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["collectoo_worker"]
branch = true
