[project]
name = "collectoo-worker"
version = "0.1.0"
description = "Collectoo worker: boarding, calculation engine, ledger, flows, channels, AI gateway"
authors = [{ name = "Collectoo" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=40.44.0",
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "polars>=2.1.0",
    "psycopg[binary]>=3.3.8",
    "pyyaml>=6.0.3",
]

[project.scripts]
collectoo-worker = "collectoo_worker:main"
synth = "collectoo_worker.synth.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "types-pyyaml>=6.0.12.20261103",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "xlsxwriter>=3.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004"]
# Synthetic data: non-cryptographic randomness is intended (seeded, reproducible).
"src/collectoo_worker/synth/**" = ["S311"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration'"
markers = ["integration: needs the local Supabase stack (make up)"]

[tool.coverage.run]
source = ["collectoo_worker"]
branch = true
