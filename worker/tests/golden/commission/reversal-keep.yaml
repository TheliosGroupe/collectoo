# The mandate's clause keeps the fee when a collection is undone (`on_reversal: keep`; founder #6 « unless the mandate
# says the fee stays due », OQ-39): the reversal gives nothing back, and the money collected again earns commission
# again. TO VALIDATE: only with such a clause.
case: reversal-keep
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  garde:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: keep}
    rules:
      - {id: tout, tier_key: tout, label_fr: "Toutes créances", match: {}, rate: {kind: flat, rate: "0.10"}}
mandates:
  MAND-K: [{id: k1, from: "2026-01-01", to: null, schedule: garde}]
files:
  F-K: {mandate: MAND-K, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1
    lines:
      - {entry: A, kind: allocation, file: F-K, e: "2026-10-01", eff: "2026-10-01", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines:
        A: {commission: "10000", parts: {tout: "10000"}}
      documents:
        MAND-K:
          invoice: {number: FC-2026-000001, ht: "10000", vat: "2000", ttc: "12000"}
  - name: run 2 — A undone, the fee stays due, no credit note
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-K, e: "2026-10-01", eff: "2026-10-20", amount: "-100000", basis: {principal: "-100000"}}
    expect:
      lines:
        R-A: {commission: "0", parts: {tout: "0"}}     # its basis leaves the tier position, its 100,00 are kept
      documents: {}
  - name: run 3 — collected again
    lines:
      - {entry: A2, kind: allocation, file: F-K, e: "2026-11-02", eff: "2026-11-02", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines:
        A2: {commission: "10000", parts: {tout: "10000"}}
      documents:
        MAND-K:
          invoice: {number: FC-2026-000002, ht: "10000", vat: "2000", ttc: "12000"}
