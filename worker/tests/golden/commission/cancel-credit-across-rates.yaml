# A reversal whose credit falls on invoices at two VAT rates, beside another reversal, cancelled and run again (M2c-4
# C7; M2c-5b review math#0, no manual credit note). Marginal 5 % up to 1 000,00 €, then 10 %. A 1 000,00 € at 10 % VAT
# (FC-1, 50,00 €); then at 20 %: D and E 300,00 € each (FC-2, 60,00 €), B 1 000,00 € (FC-3, 100,00 €). A and D undone in
# one run: A gives back 100,00 € (the file's tiers move down), 50,00 € on FC-1 (its own) and 50,00 € LIFO on FC-3; D
# 30,00 € on FC-2, which still charges E's 30,00 €. Cancelled: one corrective invoice per VAT rate, FC-5 50,00 € at 10 %
# and FC-6 80,00 € at 20 % (A's 50,00 € and D's 30,00 € pooled). The run again: each reversal takes on each corrective
# invoice exactly what the cancelled run took for it at that rate — A 50,00 € on FC-5 and 50,00 € on FC-6, D 30,00 € on
# FC-6 — and FC-2 keeps E's 30,00 € (before the fix A took D's share of FC-6 first, D was credited on FC-2: E's
# commission credited though E was never undone, and FC-5 left open). TO VALIDATE.
case: cancel-credit-across-rates
status: TO VALIDATE
vat_rate: "0.1000"
schedules:
  marginal:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - id: tout
        tier_key: tout
        label_fr: "Toutes créances"
        match: {}
        rate: {kind: marginal, tiers: [{up_to_minor: "100000", rate: "0.05"}, {up_to_minor: null, rate: "0.10"}]}
mandates:
  MAND-T: [{id: t-v1, from: "2026-01-01", to: null, schedule: marginal}]
files:
  F-1: {mandate: MAND-T, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1 — A at 10 % VAT
    lines:
      - {entry: A, kind: allocation, file: F-1, e: "2026-10-05", eff: "2026-10-05", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines: {A: {commission: "5000"}}
      documents:
        MAND-T: {invoice: {number: FC-2026-000001, ht: "5000", vat: "500", ttc: "5500"}}
  - name: run 2 — D and E at 20 % VAT
    vat_rate: "0.2000"
    lines:
      - {entry: D, kind: allocation, file: F-1, e: "2026-10-06", eff: "2026-10-06", amount: "30000", basis: {principal: "30000"}}
      - {entry: E, kind: allocation, file: F-1, e: "2026-10-07", eff: "2026-10-07", amount: "30000", basis: {principal: "30000"}}
    expect:
      lines: {D: {commission: "3000"}, E: {commission: "3000"}}
      documents:
        MAND-T: {invoice: {number: FC-2026-000002, ht: "6000", vat: "1200", ttc: "7200"}}
  - name: run 3 — B
    lines:
      - {entry: B, kind: allocation, file: F-1, e: "2026-10-08", eff: "2026-10-08", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines: {B: {commission: "10000"}}
      documents:
        MAND-T: {invoice: {number: FC-2026-000003, ht: "10000", vat: "2000", ttc: "12000"}}
  - name: run 4 — A and D undone (to be cancelled)
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-1, e: "2026-10-05", eff: "2026-11-02", amount: "-100000", basis: {principal: "-100000"}}
      - {entry: R-D, kind: allocation_reversal, original: D, file: F-1, e: "2026-10-06", eff: "2026-11-02", at: "2026-11-02T12:00:01+00:00", amount: "-30000", basis: {principal: "-30000"}}
    expect:
      lines:
        R-A: {commission: "-10000"}
        R-D: {commission: "-3000"}
      documents:
        MAND-T:
          credit_note:
            number: FC-2026-000004
            ht: "-13000"
            vat: "-2100"
            ttc: "-15100"
            corrected:
              FC-2026-000001: {ht: "-5000", vat: "-500"}
              FC-2026-000002: {ht: "-3000", vat: "-600"}
              FC-2026-000003: {ht: "-5000", vat: "-1000"}
      state:
        F-1/tout:
          commission: "8000"
          invoices: {FC-2026-000002: ["3000", "0"], FC-2026-000003: ["5000", "0"]}
  - name: run 4 cancelled — a corrective invoice per VAT rate
    cancel_previous:
      FC-2026-000005: {ht: "5000", vat: "500"}
      FC-2026-000006: {ht: "8000", vat: "1600"}
    expect:
      state:
        F-1/tout:
          commission: "21000"
          invoices:
            FC-2026-000002: ["3000", "0"]
            FC-2026-000003: ["5000", "0"]
            FC-2026-000005: ["5000", "0"]
            FC-2026-000006: ["8000", "0"]
  - name: run 5 — the same lines again
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-1, e: "2026-10-05", eff: "2026-11-02", amount: "-100000", basis: {principal: "-100000"}}
      - {entry: R-D, kind: allocation_reversal, original: D, file: F-1, e: "2026-10-06", eff: "2026-11-02", at: "2026-11-02T12:00:01+00:00", amount: "-30000", basis: {principal: "-30000"}}
    expect:
      lines:
        R-A: {commission: "-10000"}
        R-D: {commission: "-3000"}
      documents:
        MAND-T:
          credit_note:
            number: FC-2026-000007
            ht: "-13000"
            vat: "-2100"
            ttc: "-15100"
            corrected:
              FC-2026-000005: {ht: "-5000", vat: "-500"}
              FC-2026-000006: {ht: "-8000", vat: "-1600"}
      state:
        F-1/tout:
          commission: "8000"
          invoices: {FC-2026-000002: ["3000", "0"], FC-2026-000003: ["5000", "0"]}
