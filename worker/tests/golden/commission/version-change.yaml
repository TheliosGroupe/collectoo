# New rates only for the future (founder #5; design §8.1): each line is priced by the terms version in force on its
# encaissement date, and the tier key continues across versions. A collection under the old version is credited at
# the old rate. TO VALIDATE: synthetic terms.
case: version-change
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  avant:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - {id: tout, tier_key: tout, label_fr: "Toutes créances (15 %)", match: {}, rate: {kind: flat, rate: "0.15"}}
  apres:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - {id: tout, tier_key: tout, label_fr: "Toutes créances (12 %)", match: {}, rate: {kind: flat, rate: "0.12"}}
mandates:
  MAND-V:
    - {id: v1, from: "2026-01-01", to: "2026-11-16", schedule: avant}
    - {id: v2, from: "2026-11-16", to: null, schedule: apres}
files:
  F-V: {mandate: MAND-V, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run of 01/12 — one collection under each version
    lines:
      - {entry: B, kind: allocation, file: F-V, e: "2026-11-20", eff: "2026-11-20", amount: "100000", basis: {principal: "100000"}}
      - {entry: A, kind: allocation, file: F-V, e: "2026-11-10", eff: "2026-11-10", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines:
        A: {commission: "15000", parts: {tout: "15000"}, terms: v1}
        B: {commission: "12000", parts: {tout: "12000"}, terms: v2}
      documents:
        MAND-V:
          invoice:
            number: FC-2026-000001
            ht: "27000"
            vat: "5400"
            ttc: "32400"
            lines:
              - {claim_type: b2b_invoice, rule: tout, families: [principal], ht: "27000", tiers: [["0.15", "100000"], ["0.12", "100000"]]}
  - name: run of 16/12 — A undone, credited at the old rate
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-V, e: "2026-11-10", eff: "2026-12-10", amount: "-100000", basis: {principal: "-100000"}}
    expect:
      lines:
        R-A: {commission: "-15000", parts: {tout: "-15000"}, terms: v1}
      documents:
        MAND-V:
          credit_note:
            number: FC-2026-000002
            ht: "-15000"
            vat: "-3000"
            ttc: "-18000"
            corrected:
              FC-2026-000001: {ht: "-15000", vat: "-3000"}
