# Marginal tiers on what the file brought in (founder #5): a collection that crosses the tier inside one run, a
# reversal that goes back across it, credited first on the invoice that charged the collection it undoes (founder #6:
# « a credit note on the original invoice »), the rest LIFO, and the credit-note VAT by cumulative difference — the
# full credit of an invoice gives back exactly its VAT. TO VALIDATE: synthetic grid; credit notes on undone
# collections are founder #6 / OQ-39.
case: marginal-tiers-crossed
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  paliers:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - id: paliers
        tier_key: paliers
        label_fr: "Toutes créances"
        match: {}
        rate: {kind: marginal, tiers: [{up_to_minor: "500000", rate: "0.10"}, {up_to_minor: null, rate: "0.06"}]}
mandates:
  MAND-P: [{id: p-v1, from: "2026-01-01", to: null, schedule: paliers}]
files:
  F-1: {mandate: MAND-P, claim_type: b2b_invoice, portfolio: P1}
  F-2: {mandate: MAND-P, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1
    lines:
      - {entry: A, kind: allocation, file: F-1, e: "2026-10-20", eff: "2026-10-20", amount: "400000", basis: {principal: "400000"}}
    expect:
      lines:
        A: {commission: "40000", parts: {paliers: "40000"}}
      documents:
        MAND-P:
          invoice:
            number: FC-2026-000001
            ht: "40000"
            vat: "8000"
            ttc: "48000"
            lines:
              - {claim_type: b2b_invoice, rule: paliers, families: [principal], ht: "40000", tiers: [["0.10", "400000"]]}
  - name: run 2 — the collection crosses 5 000,00 €
    lines:
      - {entry: B, kind: allocation, file: F-1, e: "2026-11-05", eff: "2026-11-05", amount: "200000", basis: {principal: "200000"}}
    expect:
      lines:
        B: {commission: "16000", parts: {paliers: "16000"}}        # 10 % × 1 000,00 + 6 % × 1 000,00
      documents:
        MAND-P:
          invoice:
            number: FC-2026-000002
            ht: "16000"
            vat: "3200"
            ttc: "19200"
            lines:
              - {claim_type: b2b_invoice, rule: paliers, families: [principal], ht: "16000", tiers: [["0.10", "100000"], ["0.06", "100000"]]}
  - name: run 3 — A undone (back across the tier), a new file collects
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-1, e: "2026-10-20", eff: "2026-11-25", amount: "-400000", basis: {principal: "-400000"}}
      - {entry: C, kind: allocation, file: F-2, e: "2026-11-20", eff: "2026-11-20", amount: "50000", basis: {principal: "50000"}}
    expect:
      lines:
        R-A: {commission: "-36000", parts: {paliers: "-36000"}}     # F(2 000,00) − F(6 000,00) = 200,00 − 560,00
        C: {commission: "5000", parts: {paliers: "5000"}}
      documents:
        MAND-P:
          invoice:
            number: FC-2026-000003
            ht: "5000"
            vat: "1000"
            ttc: "6000"
            lines:
              - {claim_type: b2b_invoice, rule: paliers, families: [principal], ht: "5000", tiers: [["0.10", "50000"]]}
          credit_note:
            number: FC-2026-000004
            ht: "-36000"
            vat: "-7200"
            ttc: "-43200"
            corrected:
              FC-2026-000001: {ht: "-36000", vat: "-7200"}          # A's own invoice (400,00 charged): 40,00 stays open
  - name: run 4 — B undone, the file back to 0
    lines:
      - {entry: R-B, kind: allocation_reversal, original: B, file: F-1, e: "2026-11-05", eff: "2026-12-02", amount: "-200000", basis: {principal: "-200000"}}
    expect:
      lines:
        R-B: {commission: "-20000", parts: {paliers: "-20000"}}
      documents:
        MAND-P:
          credit_note:
            number: FC-2026-000005
            ht: "-20000"
            vat: "-4000"
            ttc: "-24000"
            corrected:
              FC-2026-000002: {ht: "-16000", vat: "-3200"}          # B's own invoice first, in full: its whole VAT
              FC-2026-000001: {ht: "-4000", vat: "-800"}            # then LIFO: FC-1's last 40,00 (72,00 + 8,00 = its VAT)
