# Across versions the per-version differences no longer telescope; the engine keeps each (file, tier key)'s commission
# within [0, ⌊basis / 1,20⌋]: a credit never exceeds what was charged, the TTC never what the file brought in, and a
# file undone in full is back to 0. Inside one version the bound never binds. The marginal grid is deliberately
# extreme (0 % then 100 %) to make the bound bite. TO VALIDATE: our reading of « never above what the file brought
# in » (founder #5) for a file whose collections straddle two versions.
case: cross-version-bounds
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  gratuit:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - {id: tout, tier_key: tout, label_fr: "Toutes créances", match: {}, rate: {kind: flat, rate: "0"}}
  extreme:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - id: tout
        tier_key: tout
        label_fr: "Toutes créances"
        match: {}
        rate: {kind: marginal, tiers: [{up_to_minor: "100000", rate: "0"}, {up_to_minor: null, rate: "1"}]}
mandates:
  MAND-X:
    - {id: x1, from: "2026-01-01", to: "2026-11-16", schedule: gratuit}
    - {id: x2, from: "2026-11-16", to: null, schedule: extreme}
files:
  F-X: {mandate: MAND-X, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1 — 5 000,00 € under x1, then 1 000,00 € under x2 (the tier continues)
    lines:
      - {entry: A, kind: allocation, file: F-X, e: "2026-11-10", eff: "2026-11-10", amount: "500000", basis: {principal: "500000"}}
      - {entry: B, kind: allocation, file: F-X, e: "2026-11-20", eff: "2026-11-20", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines:
        A: {commission: "0", parts: {tout: "0"}, terms: x1}
        B: {commission: "100000", parts: {tout: "100000"}, terms: x2}   # F₂(6 000,00) − F₂(5 000,00) = 5 000,00 − 4 000,00
      documents:
        MAND-X:
          invoice: {number: FC-2026-000001, ht: "100000", vat: "20000", ttc: "120000"}
  - name: run 2 — A undone under x1 (nothing to give back by x1), held at ⌊1 000,00 / 1,2⌋
    lines:
      - {entry: R-A, kind: allocation_reversal, file: F-X, e: "2026-11-10", eff: "2026-12-01", amount: "-500000", basis: {principal: "-500000"}}
    expect:
      lines:
        R-A: {commission: "-16667", parts: {tout: "-16667"}, clamped: true}
      documents:
        MAND-X:
          credit_note:
            number: FC-2026-000002
            ht: "-16667"
            vat: "-3333"
            ttc: "-20000"         # net TTC 1 000,00 € = what the file brought in
            corrected:
              FC-2026-000001: {ht: "-16667", vat: "-3333"}
  - name: run 3 — B undone, the file back to 0
    lines:
      - {entry: R-B, kind: allocation_reversal, file: F-X, e: "2026-11-20", eff: "2026-12-10", amount: "-100000", basis: {principal: "-100000"}}
    expect:
      lines:
        R-B: {commission: "-83333", parts: {tout: "-83333"}}
      documents:
        MAND-X:
          credit_note:
            number: FC-2026-000003
            ht: "-83333"
            vat: "-16667"         # FC-1 credited in full: 3 333 + 16 667 = its 20 000 of VAT
            ttc: "-100000"
            corrected:
              FC-2026-000001: {ht: "-83333", vat: "-16667"}
