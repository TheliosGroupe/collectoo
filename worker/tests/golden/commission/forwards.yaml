# Money passed to the client without allocation earns commission only when the schedule lists its reason (founder #4,
# design §8.3); a forward has no component family, so a rule that filters families never takes it. Its reversal gives
# back what it earned. TO VALIDATE: synthetic clause listing the client's ratification (C. civ. 1342-2).
case: forwards
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  ratification:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: true}, on_reversal: credit}
    rules:
      - {id: interets, tier_key: interets, label_fr: "Intérêts", match: {families: [interest]}, rate: {kind: flat, rate: "0.20"}}
      - {id: autres, tier_key: autres, label_fr: "Autres sommes", match: {}, rate: {kind: flat, rate: "0.10"}}
mandates:
  MAND-F: [{id: f1, from: "2026-01-01", to: null, schedule: ratification}]
files:
  F-F: {mandate: MAND-F, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1
    lines:
      - {entry: FW1, kind: forward, file: F-F, e: "2026-10-05", eff: "2026-10-05", amount: "50000", forward_reason: client_ratification}
      - {entry: FW2, kind: forward, file: F-F, e: "2026-10-06", eff: "2026-10-06", amount: "30000", forward_reason: file_recalled}
      - {entry: AL, kind: allocation, file: F-F, e: "2026-10-07", eff: "2026-10-07", amount: "10000", basis: {interest: "1000", principal: "9000"}}
    expect:
      lines:
        FW1: {commission: "5000", parts: {autres: "5000"}}       # listed reason; the interest rule skipped
        FW2: {commission: "0", parts: {}}                        # a recalled file: not listed
        AL: {commission: "1100", parts: {interets: "200", autres: "900"}}
      documents:
        MAND-F:
          invoice:
            number: FC-2026-000001
            ht: "6100"
            vat: "1220"
            ttc: "7320"
            lines:
              - {claim_type: b2b_invoice, rule: autres, families: [forward, principal], ht: "5900", tiers: [["0.10", "59000"]]}
              - {claim_type: b2b_invoice, rule: interets, families: [interest], ht: "200", tiers: [["0.20", "1000"]]}
  - name: run 2 — both forwards undone
    lines:
      - {entry: R-FW1, kind: forward_reversal, file: F-F, e: "2026-10-05", eff: "2026-11-03", amount: "-50000", forward_reason: client_ratification}
      - {entry: R-FW2, kind: forward_reversal, file: F-F, e: "2026-10-06", eff: "2026-11-03", amount: "-30000", forward_reason: file_recalled}
    expect:
      lines:
        R-FW1: {commission: "-5000", parts: {autres: "-5000"}}
        R-FW2: {commission: "0", parts: {}}
      documents:
        MAND-F:
          credit_note:
            number: FC-2026-000002
            ht: "-5000"
            vat: "-1000"
            ttc: "-6000"
            corrected:
              FC-2026-000001: {ht: "-5000", vat: "-1000"}
