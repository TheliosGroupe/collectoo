# The waiver is held per (invoice, file, tier key), not per key (M2c-5b): A charged on FC-1, B on FC-2, then a manual
# credit note of 40,00 € on FC-2. Undoing A credits FC-1 in full and leaves FC-2's waiver alone — a waiver held per key
# would have absorbed 40,00 € of A's credit, billing the client again for B the 40,00 € it was given back. Undoing B
# then: 40,00 € absorbed by FC-2's waiver, 60,00 € credited on FC-2. The file ends at 0 with nothing waived.
# TO VALIDATE: synthetic grid (OQ-78).
case: manual-credit-per-invoice
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  flat:
    schema: commission-1
    basis: {families: all, forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - {id: tout, tier_key: tout, label_fr: "Toutes créances", match: {}, rate: {kind: flat, rate: "0.10"}}
mandates:
  MAND-W: [{id: w-v1, from: "2026-01-01", to: null, schedule: flat}]
files:
  F-1: {mandate: MAND-W, claim_type: b2b_invoice, portfolio: P1}
runs:
  - name: run 1 — A
    lines:
      - {entry: A, kind: allocation, file: F-1, e: "2026-10-12", eff: "2026-10-12", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines: {A: {commission: "10000"}}
      documents:
        MAND-W: {invoice: {number: FC-2026-000001, ht: "10000", vat: "2000", ttc: "12000"}}
  - name: run 2 — B
    lines:
      - {entry: B, kind: allocation, file: F-1, e: "2026-10-26", eff: "2026-10-26", amount: "100000", basis: {principal: "100000"}}
    expect:
      lines: {B: {commission: "10000"}}
      documents:
        MAND-W: {invoice: {number: FC-2026-000002, ht: "10000", vat: "2000", ttc: "12000"}}
  - name: a manual credit note of 40,00 € HT on FC-2 (FC-2026-000003)
    manual_credit_notes:
      - invoice: FC-2026-000002
        amount: "4000"
        expect: {ht: "4000", vat: "800", allocations: {F-1/tout: "4000"}}
    expect:
      state: {F-1/tout: {commission: "20000", waived: "4000"}}
  - name: run 3 — A undone, on FC-1 alone
    lines:
      - {entry: R-A, kind: allocation_reversal, original: A, file: F-1, e: "2026-10-12", eff: "2026-11-16", amount: "-100000", basis: {principal: "-100000"}}
    expect:
      lines: {R-A: {commission: "-10000"}}
      documents:
        MAND-W:
          credit_note:
            number: FC-2026-000004
            ht: "-10000"
            vat: "-2000"
            ttc: "-12000"
            corrected:
              FC-2026-000001: {ht: "-10000", vat: "-2000"}
      state: {F-1/tout: {commission: "10000", waived: "4000"}}
  - name: run 4 — B undone, FC-2's waiver first
    lines:
      - {entry: R-B, kind: allocation_reversal, original: B, file: F-1, e: "2026-10-26", eff: "2026-12-01", amount: "-100000", basis: {principal: "-100000"}}
    expect:
      lines: {R-B: {commission: "-10000"}}
      documents:
        MAND-W:
          credit_note:
            number: FC-2026-000005
            ht: "-6000"
            vat: "-1200"          # R(100,00 × 20 %) − R(40,00 × 20 %)
            ttc: "-7200"
            corrected:
              FC-2026-000002: {ht: "-6000", vat: "-1200"}
          absorbed:
            FC-2026-000002: {F-1/tout: "4000"}
      state: {F-1/tout: {commission: "0", waived: "0"}}
