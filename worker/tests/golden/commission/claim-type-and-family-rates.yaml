# A rate per claim type and per component family (founder #5), first match wins; the basis limited to principal and
# interest by the schedule (founder #4: only what the mandate names). TO VALIDATE: synthetic grid.
case: claim-type-and-family-rates
status: TO VALIDATE
vat_rate: "0.2000"
schedules:
  grille:
    schema: commission-1
    basis: {families: [principal, interest], forwards: {file_recalled: false, before_servicing_start: false, client_ratification: false}, on_reversal: credit}
    rules:
      - {id: b2b, tier_key: b2b, label_fr: "Factures entre professionnels", match: {claim_types: [b2b_invoice]}, rate: {kind: flat, rate: "0.15"}}
      - {id: interets, tier_key: interets, label_fr: "Intérêts", match: {families: [interest]}, rate: {kind: flat, rate: "0.20"}}
      - {id: autres, tier_key: autres, label_fr: "Autres créances", match: {}, rate: {kind: flat, rate: "0.10"}}
mandates:
  MAND-GRILLE: [{id: grille-v1, from: "2026-01-01", to: null, schedule: grille}]
files:
  F-B2B: {mandate: MAND-GRILLE, claim_type: b2b_invoice, portfolio: P1}
  F-PRO: {mandate: MAND-GRILLE, claim_type: professional_loan, portfolio: P1}
runs:
  - name: one run, two files
    lines:
      # the b2b rule takes the whole file (first match), interest included; the charge is not in the basis
      - {entry: A1, kind: allocation, file: F-B2B, e: "2026-11-02", eff: "2026-11-02", amount: "114000", basis: {principal: "100000", interest: "10000", charge: "4000"}}
      # a loan: interest at 20 %, principal at 10 %, two tier keys; the charge is not in the basis
      - {entry: A2, kind: allocation, file: F-PRO, e: "2026-11-03", eff: "2026-11-03", amount: "57000", basis: {principal: "50000", interest: "5000", charge: "2000"}}
    expect:
      lines:
        A1: {commission: "16500", parts: {b2b: "16500"}}           # 15 % × 1 100,00 €
        A2: {commission: "6000", parts: {interets: "1000", autres: "5000"}}
      documents:
        MAND-GRILLE:
          invoice:
            number: FC-2026-000001
            ht: "22500"
            vat: "4500"
            ttc: "27000"
            lines:
              - {claim_type: b2b_invoice, rule: b2b, families: [interest, principal], ht: "16500", tiers: [["0.15", "110000"]]}
              - {claim_type: professional_loan, rule: autres, families: [principal], ht: "5000", tiers: [["0.10", "50000"]]}
              - {claim_type: professional_loan, rule: interets, families: [interest], ht: "1000", tiers: [["0.20", "5000"]]}
